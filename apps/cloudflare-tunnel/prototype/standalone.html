<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>概览 · Tunnel for fnOS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23245bff'/%3E%3Cpath d='M11 23.5c3.2-7.2 6.9-7.2 9 0 2.1 7.2 5.8 7.2 9 0' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
:root {
  --font-sans: "Manrope", "MiSans", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;

  --bg: #eef1f6;
  --bg-2: #f7f9fc;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --surface-3: #edf2f9;
  --ink: #0d1726;
  --ink-2: #3d4c63;
  --ink-3: #6b7a90;
  --ink-4: #93a0b4;
  --line: rgba(15, 30, 50, 0.08);
  --line-strong: rgba(15, 30, 50, 0.14);

  --accent: #245bff;
  --accent-2: #3b6cff;
  --accent-soft: #ebf0ff;
  --accent-ink: #1b46c9;
  --teal: #0e9384;
  --teal-soft: #e6f7f4;
  --green: #0f9f6e;
  --green-soft: #e8f8f1;
  --amber: #b7791f;
  --amber-soft: #fff6e6;
  --red: #d92d20;
  --red-soft: #fff0ee;

  --shadow-xs: 0 1px 2px rgba(14, 26, 45, 0.05);
  --shadow-sm: 0 8px 20px -14px rgba(14, 26, 45, 0.22);
  --shadow-md: 0 30px 60px -34px rgba(14, 26, 45, 0.38);

  --r-sm: 9px;
  --r-md: 13px;
  --r-lg: 18px;
  --r-xl: 24px;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

  --sidebar: 244px;
  --console-bg: #0b1220;
  --console-ink: #cbd7e8;

  color-scheme: light;
}

html[data-theme="dark"] {
  --bg: #080d16;
  --bg-2: #0c1321;
  --surface: #0f1726;
  --surface-2: #121c2e;
  --surface-3: #172338;
  --ink: #eaf0fa;
  --ink-2: #b3c0d4;
  --ink-3: #8493aa;
  --ink-4: #5d6c83;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.14);

  --accent: #6b93ff;
  --accent-2: #7fa3ff;
  --accent-soft: rgba(64, 105, 255, 0.16);
  --accent-ink: #b8caff;
  --teal: #3dd6c3;
  --teal-soft: rgba(14, 147, 132, 0.16);
  --green: #3ddc97;
  --green-soft: rgba(15, 159, 110, 0.15);
  --amber: #f5c26b;
  --amber-soft: rgba(183, 121, 31, 0.16);
  --red: #ff7a70;
  --red-soft: rgba(217, 45, 32, 0.15);

  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.24);
  --shadow-sm: 0 10px 24px -16px rgba(0, 0, 0, 0.7);
  --shadow-md: 0 36px 70px -36px rgba(0, 0, 0, 0.85);

  --console-bg: #070c14;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--accent); color: #fff; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(900px 520px at 6% -10%, rgba(36, 91, 255, 0.11), transparent 62%),
    radial-gradient(760px 460px at 102% 0%, rgba(14, 147, 132, 0.08), transparent 58%),
    linear-gradient(180deg, var(--bg-2), var(--bg) 44%);
}
html[data-theme="dark"] .ambient {
  background:
    radial-gradient(900px 520px at 6% -10%, rgba(59, 108, 255, 0.16), transparent 62%),
    radial-gradient(760px 460px at 102% 0%, rgba(14, 147, 132, 0.12), transparent 58%),
    linear-gradient(180deg, var(--bg-2), var(--bg) 48%);
}

.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: var(--sidebar) minmax(0, 1fr);
  min-height: 100vh;
}

/* ---------- icon ---------- */
.icon {
  width: 18px;
  height: 18px;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
[data-icon] { display: inline-flex; align-items: center; justify-content: center; }

/* ---------- sidebar ---------- */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 22px 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  border-right: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.58);
  backdrop-filter: blur(20px);
}
html[data-theme="dark"] .sidebar { background: rgba(9, 15, 26, 0.68); }

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 2px 8px 6px;
  border-radius: 12px;
}
.brand-mark { width: 38px; height: 38px; flex: none; border-radius: 12px; box-shadow: 0 8px 18px -10px rgba(36, 91, 255, 0.6); }
.brand-mark svg { width: 38px; height: 38px; display: block; }
.brand-copy { display: flex; flex-direction: column; line-height: 1.15; }
.brand-copy strong { font-size: 16px; font-weight: 800; letter-spacing: -0.03em; }
.brand-copy small { margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-4); }

.nav { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; padding: 0 2px; }
.nav-group { display: flex; flex-direction: column; gap: 3px; }
.nav-label {
  margin: 0 0 5px;
  padding: 0 10px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.nav-link {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 38px;
  padding: 0 10px;
  border-radius: 10px;
  color: var(--ink-2);
  font-size: 13px;
  font-weight: 600;
  transition: background-color 160ms ease, color 160ms ease;
}
.nav-link::before {
  content: "";
  position: absolute;
  left: -2px;
  top: 10px;
  bottom: 10px;
  width: 3px;
  border-radius: 3px;
  background: var(--accent);
  opacity: 0;
  transform: scaleY(0.5);
  transition: opacity 160ms ease, transform 200ms var(--ease-out);
}
.nav-link .nav-icon { color: var(--ink-3); transition: color 160ms ease; }
.nav-link .nav-count {
  margin-left: auto;
  min-width: 20px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink-3);
  font-size: 10px;
  font-weight: 700;
  text-align: center;
}
.nav-link .nav-badge {
  margin-left: auto;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.nav-link .live-dot {
  margin-left: auto;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 14%, transparent);
}
.nav-link:hover { background: var(--surface-2); color: var(--ink); }
.nav-link:hover .nav-icon { color: var(--ink-2); }
.nav-link.is-active { background: var(--accent-soft); color: var(--accent-ink); }
.nav-link.is-active .nav-icon { color: var(--accent); }
.nav-link.is-active::before { opacity: 1; transform: scaleY(1); }
.nav-link.is-active .nav-count { background: rgba(255, 255, 255, 0.55); color: var(--accent-ink); }
html[data-theme="dark"] .nav-link.is-active .nav-count { background: rgba(255, 255, 255, 0.08); }

.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.host-card {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 11px 11px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface-2);
}
.host-copy { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.host-copy strong { font-size: 12px; font-weight: 700; }
.host-copy small { margin-top: 2px; font-size: 10px; color: var(--ink-3); font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.host-signal { margin-left: auto; color: var(--ink-4); }
.side-row { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
.version-tag { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink-4); text-transform: uppercase; }
.sidebar-scrim { display: none; }

/* ---------- topbar ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 30px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(20px);
}
html[data-theme="dark"] .topbar { background: rgba(9, 15, 26, 0.6); }
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 10px; }
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
.crumbs strong { color: var(--ink); font-weight: 700; }
.crumb-sep { color: var(--ink-4); }
.prototype-badge {
  padding: 3px 8px;
  border: 1px dashed var(--line-strong);
  border-radius: 999px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.account-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 38px;
  padding: 0 9px 0 5px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface);
  box-shadow: var(--shadow-xs);
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
.account-chip:hover { border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
.avatar {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: linear-gradient(135deg, #245bff, #0e9384);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.03em;
}
.account-copy { display: flex; flex-direction: column; line-height: 1.15; text-align: left; }
.account-copy strong { font-size: 11px; font-weight: 700; }
.account-copy small { margin-top: 2px; font-size: 9px; color: var(--ink-3); }
.chevron { color: var(--ink-4); }
.icon-btn.mobile-menu { display: none; }

/* ---------- page shell ---------- */
.page {
  width: 100%;
  max-width: 1480px;
  margin: 0 auto;
  padding: 30px 32px 52px;
}
.page:focus { outline: none; }
.page.is-entering { animation: page-in 280ms var(--ease-out) both; }
@keyframes page-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 22px;
  margin-bottom: 24px;
}
.page-head h1 {
  margin: 6px 0 7px;
  font-size: 32px;
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: -0.045em;
}
.page-head .sub { margin: 0; max-width: 660px; color: var(--ink-3); font-size: 13px; }
.eyebrow {
  margin: 0;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-4);
}
.page-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

/* ---------- primitives ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 38px;
  padding: 0 15px;
  border: 1px solid transparent;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 700;
  white-space: nowrap;
  transition: transform 140ms var(--ease-out), background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.46; cursor: not-allowed; transform: none; }
.btn .icon { width: 16px; height: 16px; }
.btn.primary {
  color: #fff;
  background: linear-gradient(180deg, #3b6cff, #245bff);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 8px 18px -10px rgba(36, 91, 255, 0.75);
}
html[data-theme="dark"] .btn.primary { color: #07101f; background: linear-gradient(180deg, #8aabff, #6b93ff); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 8px 20px -12px rgba(107, 147, 255, 0.7); }
.btn.primary:hover { filter: brightness(1.04); }
.btn.ghost { background: var(--surface); border-color: var(--line); color: var(--ink-2); }
.btn.ghost:hover { border-color: var(--line-strong); background: var(--surface-2); color: var(--ink); }
.btn.subtle { background: transparent; color: var(--ink-3); }
.btn.subtle:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: var(--red-soft); color: var(--red); border-color: transparent; }
.btn.danger:hover { background: color-mix(in srgb, var(--red) 18%, transparent); }
.btn.small { height: 32px; padding: 0 11px; border-radius: 9px; font-size: 11.5px; }
.btn.danger-text { color: var(--red); }
.btn.danger-text:hover { background: var(--red-soft); }
.btn .spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 700ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.icon-btn {
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: var(--ink-3);
  transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease, transform 140ms var(--ease-out);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn.is-spinning .icon { animation: spin 700ms linear infinite; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.pill.healthy { background: var(--green-soft); color: var(--green); }
.pill.warning { background: var(--amber-soft); color: var(--amber); }
.pill.danger { background: var(--red-soft); color: var(--red); }
.pill.neutral { background: var(--surface-2); color: var(--ink-3); }
.pill.info { background: var(--accent-soft); color: var(--accent-ink); }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.healthy .dot { box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 13%, transparent); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

.status-dot {
  width: 8px;
  height: 8px;
  flex: none;
  border-radius: 50%;
  background: var(--ink-4);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--ink-4) 10%, transparent);
}
.status-dot.healthy { background: var(--green); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 12%, transparent); }
.status-dot.warning { background: var(--amber); box-shadow: 0 0 0 4px color-mix(in srgb, var(--amber) 12%, transparent); }
.status-dot.danger { background: var(--red); box-shadow: 0 0 0 4px color-mix(in srgb, var(--red) 12%, transparent); }
.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 13%, transparent);
  animation: pulse 2.4s ease-in-out infinite;
}

.mono { font-family: var(--font-mono); }
.micro { font-size: 10.5px; color: var(--ink-4); }
.muted { color: var(--ink-3); }
.tiny { font-size: 10px; }
.nowrap { white-space: nowrap; }

/* ---------- cards / layout ---------- */
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-xs);
}
.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 19px 21px 0;
}
.card-head h3 { margin: 0; font-size: 13.5px; font-weight: 800; letter-spacing: -0.015em; }
.card-head p { margin: 5px 0 0; font-size: 11px; color: var(--ink-3); }
.card-foot { padding: 14px 21px 18px; }
.link {
  border: 0;
  background: none;
  padding: 2px 0;
  color: var(--accent-ink);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.01em;
}
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

.overview-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(270px, 0.62fr); gap: 14px; align-items: stretch; }
.metric-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.lower-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(290px, 0.7fr); gap: 14px; margin-top: 14px; align-items: start; }

/* ---------- overview hero ---------- */
.hero {
  overflow: hidden;
  padding: 21px 23px 20px;
  background:
    linear-gradient(135deg, rgba(36, 91, 255, 0.075), transparent 44%),
    linear-gradient(315deg, rgba(14, 147, 132, 0.05), transparent 50%),
    var(--surface);
}
html[data-theme="dark"] .hero {
  background:
    linear-gradient(135deg, rgba(59, 108, 255, 0.16), transparent 44%),
    linear-gradient(315deg, rgba(14, 147, 132, 0.1), transparent 50%),
    var(--surface);
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse at 78% 42%, #000 0%, transparent 67%);
  opacity: 0.62;
}
.hero > * { position: relative; z-index: 1; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.hero-status { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
.hero-status .micro { font-family: var(--font-mono); letter-spacing: -0.01em; }
.hero-main { display: grid; grid-template-columns: minmax(270px, 0.9fr) minmax(340px, 1.1fr); gap: 18px; align-items: center; margin-top: 10px; }
.hero h2 {
  display: flex;
  align-items: baseline;
  gap: 9px;
  margin: 4px 0 8px;
  font-size: 29px;
  line-height: 1.08;
  font-weight: 800;
  letter-spacing: -0.045em;
}
.hero h2 .mono { font-size: 10px; font-weight: 400; color: var(--ink-4); letter-spacing: 0; }
.hero-desc { margin: 0 0 18px; max-width: 360px; color: var(--ink-3); font-size: 12.5px; line-height: 1.6; }
.uptime-label { display: block; margin-bottom: 2px; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-4); }
.uptime {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  font-size: 39px;
  line-height: 1;
  font-weight: 800;
  letter-spacing: -0.055em;
  font-variant-numeric: tabular-nums;
}
.uptime span { margin: 0 2px; font-size: 13px; font-weight: 700; letter-spacing: 0; color: var(--ink-3); }
.uptime.is-idle { color: var(--ink-4); }
.hero-actions { display: flex; align-items: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

.spine-wrap { min-width: 0; display: flex; align-items: center; justify-content: center; }
.spine { width: 100%; height: auto; max-height: 300px; overflow: visible; }
.spine .node-ring { fill: none; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 6; opacity: 0.24; }
.spine .node-core { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
.spine .node-edge .node-core { fill: var(--accent-soft); stroke: var(--accent); }
.spine .node-cloud .node-core { fill: var(--surface-2); stroke: var(--line-strong); }
.spine .node-icon { stroke: var(--ink-2); stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.spine .node-edge .node-icon { stroke: var(--accent); }
.spine .node-label { fill: var(--ink-2); font-size: 13px; font-weight: 700; font-family: var(--font-sans); text-anchor: middle; }
.spine .node-sub { fill: var(--ink-4); font-size: 10px; font-family: var(--font-mono); text-anchor: middle; }
.spine .latency-badge rect { fill: var(--surface); stroke: var(--line); }
.spine .latency-badge text { fill: var(--ink-2); font-size: 11px; font-weight: 700; font-family: var(--font-mono); text-anchor: middle; }
.spine .packet { fill: var(--accent); filter: drop-shadow(0 0 4px var(--accent)); }
.spine.is-idle .packet { display: none; }
.spine.is-idle .node-ring { opacity: 0.1; }
.spine.is-idle .node-edge .node-core { fill: var(--surface-2); stroke: var(--line-strong); }
.spine.is-idle .node-edge .node-icon { stroke: var(--ink-4); }
.spine.is-idle .latency-badge { display: none; }
.spine.is-idle .node-label { opacity: 0.72; }
.spine.is-idle .node-sub { opacity: 0.42; }

/* ---------- quick actions ---------- */
.quick { display: flex; flex-direction: column; padding-bottom: 10px; }
.quick .card-head { padding-bottom: 7px; }
.quick-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: calc(100% - 20px);
  margin: 2px 10px;
  padding: 11px 10px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  text-align: left;
  transition: background-color 160ms ease, transform 160ms var(--ease-out);
}
.quick-item:hover { background: var(--surface-2); transform: translateX(2px); }
.quick-item .q-icon {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--surface-2);
  color: var(--ink-3);
  border: 1px solid var(--line);
}
.quick-item .q-copy { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.quick-item .q-copy strong { font-size: 11.5px; font-weight: 700; }
.quick-item .q-copy small { font-size: 10px; color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quick-item .q-chevron { margin-left: auto; color: var(--ink-4); }
.quick-sep { height: 1px; margin: 9px 18px; background: var(--line); }
.quick-health { margin-top: auto; padding: 14px 20px 6px; border-top: 1px solid var(--line); }
.qh-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 10px; color: var(--ink-3); }
.qh-top strong { font-size: 21px; line-height: 1; font-weight: 800; letter-spacing: -0.045em; color: var(--ink); font-variant-numeric: tabular-nums; }
.qh-top small { margin-left: 1px; font-size: 9px; font-weight: 700; letter-spacing: 0; color: var(--ink-3); }
.qh-bars { display: flex; align-items: flex-end; gap: 3px; height: 24px; margin-top: 9px; }
.qh-bars span { flex: 1; height: var(--h); border-radius: 2px; background: var(--green); opacity: 0.2; }
.qh-bars span:nth-child(3n) { opacity: 0.35; }
.qh-bars span:last-child { opacity: 0.88; }
.qh-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 7px; font-size: 9px; color: var(--ink-4); }
.mini-note { display: flex; align-items: center; gap: 8px; padding: 4px 20px 8px; font-size: 10px; color: var(--ink-3); }
.mini-note .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 12%, transparent); }
.mini-note .mono { margin-left: auto; color: var(--ink-4); }

/* ---------- metrics ---------- */
.metric { overflow: hidden; padding: 17px 18px 15px; }
.metric-label { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-4); }
.metric-label .icon { width: 14px; height: 14px; }
.metric-value { margin-top: 9px; font-size: 26px; line-height: 1; font-weight: 800; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; }
.metric-value small { margin-left: 3px; font-size: 11px; font-weight: 700; letter-spacing: 0; color: var(--ink-3); }
.metric-foot { display: flex; align-items: center; gap: 7px; margin-top: 9px; font-size: 10px; color: var(--ink-4); }
.trend { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; font-size: 9.5px; }
.trend.up { color: var(--green); }
.trend.down { color: var(--teal); }
.trend.flat { color: var(--ink-4); }
.metric-spark { position: absolute; right: 10px; bottom: 8px; width: 84px; height: 28px; opacity: 0.9; }
.metric-spark path.line { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; }
.metric-spark path.area { opacity: 0.16; }
.metric-spark.green path.line { stroke: var(--green); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; text-align: left; }
.data-table th {
  padding: 10px 21px;
  border-bottom: 1px solid var(--line);
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-4);
  white-space: nowrap;
}
.data-table td { padding: 12px 21px; border-bottom: 1px solid var(--line); font-size: 12px; vertical-align: middle; }
.data-table tr:last-child td { border-bottom: 0; }
.data-table tbody tr { transition: background-color 150ms ease; }
.data-table tbody tr:hover { background: var(--surface-2); }
.data-table .host { font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; letter-spacing: -0.02em; }
.data-table .service { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); }
.data-table .cell-actions { text-align: right; white-space: nowrap; }
.data-table .cell-actions .icon-btn { width: 28px; height: 28px; }
.table-empty { padding: 34px 21px; text-align: center; color: var(--ink-3); font-size: 12px; }

/* ---------- activity ---------- */
.activity { padding-bottom: 12px; }
.timeline { margin: 6px 0 0; padding: 0 21px 6px; list-style: none; }
.timeline li { position: relative; display: flex; gap: 11px; padding: 10px 0; }
.timeline li:not(:last-child)::before { content: ""; position: absolute; left: 11px; top: 33px; bottom: -4px; width: 1px; background: var(--line); }
.timeline .t-icon {
  width: 23px;
  height: 23px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--ink-3);
}
.timeline .t-icon .icon { width: 13px; height: 13px; }
.timeline .t-icon.green { background: var(--green-soft); border-color: transparent; color: var(--green); }
.timeline .t-icon.blue { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.timeline .t-icon.teal { background: var(--teal-soft); border-color: transparent; color: var(--teal); }
.timeline .t-copy { min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-top: 1px; }
.timeline .t-copy strong { font-size: 11px; font-weight: 700; line-height: 1.45; }
.timeline .t-copy span { font-size: 9.5px; color: var(--ink-4); }

/* ---------- toolbars ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar .spacer { flex: 1; }
.segmented {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
}
.segmented button {
  height: 29px;
  padding: 0 11px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--ink-3);
  font-size: 10.5px;
  font-weight: 700;
  transition: background-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
}
.segmented button:hover { color: var(--ink); }
.segmented button.is-active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-xs); }
html[data-theme="dark"] .segmented button.is-active { background: var(--surface-3); }
.search {
  position: relative;
  min-width: 220px;
}
.search .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ink-4); }
.search input {
  width: 100%;
  height: 36px;
  padding: 0 12px 0 34px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  font-size: 11.5px;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
.search input::placeholder { color: var(--ink-4); }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 13%, transparent); }

/* ---------- tunnels ---------- */
.tunnel-list { overflow: hidden; }
.tunnel-row {
  position: relative;
  display: grid;
  grid-template-columns: minmax(210px, 1.25fr) 92px 104px minmax(150px, 0.8fr) auto;
  gap: 14px;
  align-items: center;
  padding: 15px 19px;
  border-bottom: 1px solid var(--line);
  transition: background-color 160ms ease;
}
.tunnel-row:last-child { border-bottom: 0; }
.tunnel-row:hover { background: var(--surface-2); }
.tunnel-row.is-active { background: linear-gradient(90deg, var(--accent-soft), transparent 52%); }
.tunnel-row.is-active::before { content: ""; position: absolute; left: 0; top: 15px; bottom: 15px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.tunnel-ident { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tunnel-ident .t-copy { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.tunnel-ident strong { font-size: 12.5px; font-weight: 800; letter-spacing: -0.01em; }
.tunnel-ident .mono { font-size: 9.5px; color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tunnel-meta { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.tunnel-meta strong { display: block; font-size: 11px; color: var(--ink-2); font-weight: 700; }
.tunnel-status { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.tunnel-status .micro { font-size: 9.5px; }
.row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 5px; opacity: 0.62; transition: opacity 160ms ease; }
.tunnel-row:hover .row-actions, .tunnel-row.is-active .row-actions { opacity: 1; }
@media (hover: none) { .row-actions { opacity: 1; } }

/* ---------- routes ---------- */
.routes-layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.78fr); gap: 14px; align-items: start; }
.route-list { overflow: hidden; }
.route-row {
  display: grid;
  grid-template-columns: 22px 22px minmax(150px, 1fr) 20px minmax(160px, 1fr) 84px auto;
  gap: 10px;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  transition: background-color 150ms ease, box-shadow 150ms ease, opacity 150ms ease;
}
.route-row:last-child { border-bottom: 0; }
.route-row:hover { background: var(--surface-2); }
.route-row.is-dragging { opacity: 0.42; }
.route-row.is-drag-over { box-shadow: inset 0 2px 0 var(--accent); }
.route-row.is-catchall { background: var(--surface-2); }
.route-index { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-4); text-align: center; }
.drag-handle { color: var(--ink-4); cursor: grab; border: 0; background: none; padding: 2px; }
.drag-handle:active { cursor: grabbing; }
.route-host { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.route-host strong { font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.route-host small { font-size: 9px; color: var(--ink-4); }
.route-arrow { color: var(--ink-4); }
.route-service { min-width: 0; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.route-actions { display: flex; align-items: center; justify-content: flex-end; gap: 3px; opacity: 0.4; transition: opacity 150ms ease; }
.route-row:hover .route-actions { opacity: 1; }
.route-note {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 16px;
  border-top: 1px solid var(--line);
  font-size: 10px;
  color: var(--ink-4);
}
.route-note .icon { width: 14px; height: 14px; color: var(--ink-4); }
.yaml-card { position: sticky; top: 74px; overflow: hidden; }
.yaml-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
.yaml-head .file { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10.5px; color: #9fb0c7; }
.yaml-head .file .icon { width: 14px; height: 14px; }
.yaml-code {
  margin: 0;
  padding: 16px 17px 18px;
  max-height: 438px;
  overflow: auto;
  background: var(--console-bg);
  color: #cbd7e8;
  font-family: var(--font-mono);
  font-size: 10.5px;
  line-height: 1.75;
  tab-size: 2;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.yaml-code .y-key { color: #8fb4ff; }
.yaml-code .y-val { color: #a7e8c8; }
.yaml-code .y-cmt { color: #62738c; }
.yaml-code .y-dash { color: #62738c; }
.yaml-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); color: #7f91a9; font-size: 9.5px; }
.dns-summary { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); font-size: 10px; color: var(--ink-3); flex-wrap: wrap; }
.dns-summary .pill { height: 21px; font-size: 9px; }

/* ---------- logs ---------- */
.logs-layout { display: grid; grid-template-columns: minmax(0, 1fr) 286px; gap: 14px; align-items: start; }
.log-console { overflow: hidden; background: var(--console-bg); border-color: rgba(255, 255, 255, 0.09); }
.log-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 15px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  color: #8fa0b8;
  font-size: 10px;
}
.log-head-left { display: flex; align-items: center; gap: 9px; font-family: var(--font-mono); }
.log-head-left .live-dot { background: #3ddc97; }
.log-head-right { display: flex; align-items: center; gap: 10px; }
.log-count { font-family: var(--font-mono); color: #62738c; }
.log-body { height: 528px; overflow: auto; overscroll-behavior: contain; }
.log-entry { border-bottom: 1px solid rgba(255, 255, 255, 0.045); }
.log-line {
  display: grid;
  grid-template-columns: 68px 38px minmax(0, 1fr);
  gap: 9px;
  width: 100%;
  padding: 7px 15px;
  border: 0;
  background: transparent;
  text-align: left;
  color: var(--console-ink);
  font-family: var(--font-mono);
  font-size: 10.5px;
  line-height: 1.55;
  transition: background-color 120ms ease;
}
.log-line:hover { background: rgba(255, 255, 255, 0.035); }
.log-time { color: #5f7189; }
.log-level { font-size: 9px; font-weight: 700; letter-spacing: 0.04em; }
.log-level.inf { color: #58d6a2; }
.log-level.wrn { color: #f0bf6a; }
.log-level.err { color: #ff8178; }
.log-level.dbg { color: #7f91a9; }
.log-msg { min-width: 0; overflow-wrap: anywhere; }
.log-msg .meta { margin-left: 7px; color: #6f8199; }
.log-detail {
  margin: 0;
  padding: 9px 15px 12px 130px;
  background: rgba(255, 255, 255, 0.025);
  color: #90a3bb;
  font-family: var(--font-mono);
  font-size: 9.5px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.log-empty { padding: 54px 16px; text-align: center; color: #6f8199; font-size: 11px; }
.log-side { display: flex; flex-direction: column; gap: 14px; }
.info-card { padding: 16px 17px; }
.info-card h3 { margin: 0 0 10px; font-size: 12px; font-weight: 800; }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 10.5px; }
.kv:last-child { border-bottom: 0; }
.kv span { color: var(--ink-3); }
.kv strong { font-weight: 700; font-size: 10.5px; }
.kv .mono { font-size: 9.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 12px; padding-top: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; color: var(--ink-3); }
.legend i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.legend .inf { background: var(--green); }
.legend .wrn { background: var(--amber); }
.legend .err { background: var(--red); }
.legend .dbg { background: var(--ink-4); }

/* ---------- integration ---------- */
.banner {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  margin-bottom: 14px;
  border: 1px solid var(--accent-soft);
  border-radius: var(--r-md);
  background: linear-gradient(90deg, var(--accent-soft), transparent 70%);
  font-size: 11.5px;
  color: var(--ink-2);
}
.banner .icon { color: var(--accent); flex: none; margin-top: 1px; }
.banner strong { color: var(--ink); }
.integration-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr); gap: 14px; align-items: start; }
.endpoint-card { padding: 18px 19px; }
.endpoint-card h3 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; font-weight: 800; }
.endpoint-card p { margin: 6px 0 13px; font-size: 10.5px; color: var(--ink-3); }
.endpoint-row { display: flex; align-items: center; gap: 8px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.endpoint-row .mono { min-width: 0; flex: 1; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.endpoint-meta { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 9.5px; color: var(--ink-4); }
.code-block {
  margin: 13px 0 0;
  padding: 13px 14px;
  border-radius: 11px;
  background: var(--console-bg);
  color: #cbd7e8;
  font-family: var(--font-mono);
  font-size: 9.5px;
  line-height: 1.7;
  overflow-x: auto;
  white-space: pre;
  overflow-wrap: anywhere;
}
.code-block .c { color: #6f8199; }
.code-block .k { color: #8fb4ff; }
.code-block .s { color: #a7e8c8; }
.credentials { padding-bottom: 8px; }
.credential-row { display: flex; align-items: center; gap: 10px; padding: 11px 18px; border-bottom: 1px solid var(--line); }
.credential-row:last-child { border-bottom: 0; }
.credential-icon { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-3); }
.credential-copy { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.credential-copy strong { font-size: 11px; font-weight: 700; }
.credential-copy small { font-size: 9px; color: var(--ink-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.credential-row .pill { margin-left: auto; }

/* ---------- settings ---------- */
.settings-wrap { max-width: 980px; display: flex; flex-direction: column; gap: 14px; }
.settings-card { padding: 0; overflow: hidden; }
.settings-card .card-head { padding: 19px 21px 3px; }
.settings-card .card-head h3 { font-size: 14px; }
.settings-card .card-head p { font-size: 10.5px; }
.setting-row {
  display: grid;
  grid-template-columns: minmax(180px, 0.75fr) minmax(260px, 1.25fr);
  gap: 22px;
  align-items: center;
  padding: 15px 21px;
  border-top: 1px solid var(--line);
}
.setting-row:first-of-type { border-top: 0; }
.setting-copy strong { display: block; font-size: 11.5px; font-weight: 700; }
.setting-copy small { display: block; margin-top: 3px; font-size: 10px; color: var(--ink-3); line-height: 1.5; }
.setting-control { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.setting-control .search { min-width: 0; width: 100%; }
.input, .select {
  height: 36px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  font-size: 11.5px;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
.input:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 13%, transparent); }
.input.mono { font-family: var(--font-mono); font-size: 10.5px; }
.input-wrap { position: relative; display: flex; align-items: center; width: 100%; }
.input-wrap .input { width: 100%; padding-right: 38px; }
.input-wrap .icon-btn { position: absolute; right: 2px; width: 30px; height: 30px; }
.select { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.verify-line { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--green); }
.verify-line .icon { width: 14px; height: 14px; }
.danger-zone { border-color: color-mix(in srgb, var(--red) 20%, var(--line)); }
.danger-zone .card-head h3 { color: var(--red); }
.danger-zone .setting-row { border-top-color: color-mix(in srgb, var(--red) 12%, var(--line)); }
.save-state { font-size: 10px; color: var(--ink-4); margin-right: 2px; }
.save-state.is-dirty { color: var(--amber); }

/* switches */
.switch { position: relative; display: inline-flex; width: 38px; height: 22px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 1; margin: 0; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line); transition: background-color 180ms ease, border-color 180ms ease; }
.switch i::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(10, 20, 35, 0.22);
  transition: transform 200ms var(--ease-out);
}
.switch input:checked + i { background: var(--accent); border-color: var(--accent); }
.switch input:checked + i::after { transform: translateX(16px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch-row { display: flex; align-items: center; gap: 12px; width: 100%; justify-content: space-between; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 10.5px; font-weight: 800; color: var(--ink-2); }
.field .hint { font-size: 9.5px; color: var(--ink-4); line-height: 1.5; }
.field .error { display: none; font-size: 9.5px; color: var(--red); }
.field.has-error .input { border-color: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 10%, transparent); }
.field.has-error .error { display: block; }
.form-grid { display: flex; flex-direction: column; gap: 15px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.check-row { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.check-row .switch { margin-top: 1px; }
.check-copy { display: flex; flex-direction: column; gap: 2px; }
.check-copy strong { font-size: 10.5px; font-weight: 700; }
.check-copy small { font-size: 9.5px; color: var(--ink-4); line-height: 1.45; }
details.advanced { border-top: 1px solid var(--line); padding-top: 12px; }
details.advanced summary { cursor: pointer; font-size: 10.5px; font-weight: 700; color: var(--ink-3); list-style: none; display: flex; align-items: center; gap: 6px; }
details.advanced summary::-webkit-details-marker { display: none; }
details.advanced summary::before { content: "+"; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); font-size: 11px; }
details.advanced[open] summary::before { content: "−"; }
details.advanced .form-grid { margin-top: 12px; }

/* ---------- modal / drawer ---------- */
#overlay-root { position: relative; z-index: 100; }
.layer { position: fixed; inset: 0; display: grid; place-items: center; }
.layer-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(6, 12, 22, 0.42);
  backdrop-filter: blur(7px);
  opacity: 0;
  transition: opacity 220ms ease;
}
html[data-theme="dark"] .layer-backdrop { background: rgba(0, 0, 0, 0.62); }
.layer.open .layer-backdrop { opacity: 1; }

.modal {
  position: relative;
  width: min(520px, calc(100vw - 32px));
  max-height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow-md);
  opacity: 0;
  transform: translateY(8px) scale(0.96);
  transition: opacity 200ms ease, transform 260ms var(--ease-out);
}
.layer.open .modal { opacity: 1; transform: none; }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 21px 22px 0; }
.modal-head h2 { margin: 4px 0 0; font-size: 20px; line-height: 1.2; font-weight: 800; letter-spacing: -0.035em; }
.modal-body { padding: 17px 22px 4px; overflow-y: auto; }
.modal-body > p { margin: 0 0 13px; color: var(--ink-3); font-size: 11.5px; line-height: 1.65; }
.modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 17px 22px 21px; }
.modal-foot .btn { min-width: 76px; }
.modal-warning { display: flex; gap: 10px; padding: 11px 12px; margin-bottom: 14px; border-radius: 10px; background: var(--amber-soft); color: var(--ink-2); font-size: 10.5px; line-height: 1.55; }
.modal-warning .icon { color: var(--amber); flex: none; margin-top: 1px; }
.modal-warning.danger { background: var(--red-soft); }
.modal-warning.danger .icon { color: var(--red); }

.layer.drawer-layer { place-items: stretch end; }
.drawer {
  position: relative;
  width: min(440px, 100vw);
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow-md);
  transform: translateX(100%);
  transition: transform 300ms var(--ease-drawer);
}
.layer.open .drawer { transform: none; }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 22px 22px 0; }
.drawer-head h2 { margin: 4px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -0.035em; }
.drawer-head p { margin: 5px 0 0; font-size: 10.5px; color: var(--ink-3); }
.drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px 22px; }
.drawer-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 22px 20px; border-top: 1px solid var(--line); background: var(--surface); }
.drawer-foot .note { font-size: 9.5px; color: var(--ink-4); line-height: 1.45; }
.drawer-foot .actions { display: flex; gap: 8px; flex: none; }

/* ---------- toast ---------- */
.toast-stack { position: fixed; right: 22px; bottom: 22px; z-index: 200; display: flex; flex-direction: column; gap: 8px; width: min(340px, calc(100vw - 32px)); pointer-events: none; }
.toast {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 12px 12px 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  box-shadow: var(--shadow-md);
  color: var(--ink-2);
  font-size: 11px;
  line-height: 1.5;
  overflow: hidden;
  pointer-events: auto;
  opacity: 0;
  transform: translateY(8px) scale(0.98);
  transition: opacity 200ms ease, transform 240ms var(--ease-out);
}
.toast.is-in { opacity: 1; transform: none; }
.toast > .icon { width: 15px; height: 15px; flex: none; margin-top: 1px; color: var(--green); }
.toast.error > .icon { color: var(--red); }
.toast .toast-copy { flex: 1; min-width: 0; }
.toast .toast-close { border: 0; background: none; padding: 0; color: var(--ink-4); display: inline-flex; }
.toast .toast-close .icon { width: 13px; height: 13px; }
.toast .toast-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent); transform-origin: left; animation: toastbar 3200ms linear forwards; opacity: 0.55; }
.toast.error .toast-bar { background: var(--red); }

/* ---------- reveal ---------- */
@media (prefers-reduced-motion: no-preference) {

  @keyframes rise {
    from { opacity: 0; transform: translateY(9px); }
    to { opacity: 1; transform: none; }
  }
  .spine .packet { animation: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
  .spine .packet { display: none; }
}
html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after {
  animation-duration: 0.01ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.01ms !important;
  scroll-behavior: auto !important;
}
html.reduce-motion .spine .packet { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 1220px) {
  :root { --sidebar: 218px; }
  .page { padding-left: 26px; padding-right: 26px; }
  .hero-main { grid-template-columns: minmax(250px, 0.95fr) minmax(300px, 1.05fr); }

}

  .quick-sep, .quick-health, .mini-note { display: none; }
}
@media (max-width: 1080px) {

  .logs-layout { grid-template-columns: 1fr; }
  .log-side { display: grid; grid-template-columns: 1fr 1fr; }
  .integration-grid { grid-template-columns: 1fr; }
}
@media (max-width: 920px) {

    background: var(--surface);
    box-shadow: var(--shadow-md);

  .sidebar-scrim { display: block; position: fixed; inset: 0; z-index: 70; background: rgba(6, 12, 22, 0.36); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 220ms ease; }
  .app.sidebar-open .sidebar-scrim { opacity: 1; pointer-events: auto; }
  .icon-btn.mobile-menu { display: inline-flex; }
  .topbar { padding: 0 18px; }
  .page { padding: 24px 18px 44px; }
  .hero-main { grid-template-columns: 1fr; }
  .spine-wrap { order: -1; }
  .spine { max-height: 240px; }
  .page-head { align-items: flex-start; flex-direction: column; gap: 14px; }
  .page-head h1 { font-size: 29px; }
  .tunnel-row { grid-template-columns: minmax(200px, 1fr) auto; row-gap: 10px; }

  .tunnel-status { grid-column: 1; }

  .setting-row { grid-template-columns: 1fr; gap: 9px; }

}
@media (max-width: 820px) {

  .prototype-badge { display: none; }
}
@media (max-width: 700px) {
  .prototype-badge, .account-copy, .chevron { display: none; }
  .topbar-right { gap: 6px; }
  .quick { grid-template-columns: 1fr; }
  .metric-row { grid-template-columns: 1fr 1fr; }

  .log-line { grid-template-columns: 58px 34px minmax(0, 1fr); padding-left: 11px; padding-right: 11px; }

  .log-side { grid-template-columns: 1fr; }

  .drawer-foot { flex-direction: column; align-items: stretch; }

  const formatClock = (date) => {

  };

  const pad = (n) => String(n).padStart(2, '0');

    const hours = Math.floor((total % 86400) / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const seconds = total % 60;
    return `${days}<span>天</span> ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  };

  /* ---------- boot ---------- */

  function hydrateIcons(root = document) {
    $$('[data-icon]', root).forEach((el) => {
      if (!el.firstElementChild) el.innerHTML = icon(el.dataset.icon);
    });
  }

  function bindStatic() {
    $('#theme-toggle').addEventListener('click', () => {
      state.themePref = state.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('tunnel-theme', state.themePref);
      applyTheme();
      if (state.page === 'settings') updateSegmentedUI();
    });

    $('#mobile-menu').addEventListener('click', () => {
      const open = !$('#app').classList.contains('sidebar-open');
      $('#app').classList.toggle('sidebar-open', open);
      $('#sidebar-scrim').hidden = !open;
    });
    $('#sidebar-scrim').addEventListener('click', closeSidebar);

    $('#refresh-btn').addEventListener('click', () => {
      const btn = $('#refresh-btn');
      btn.classList.add('is-spinning');
      setTimeout(() => btn.classList.remove('is-spinning'), 700);
      updateUptime();
      if (state.page === 'logs') scrollLogsToBottom();
      toast('状态已刷新', 'success');
    });

    document.addEventListener('click', onDocumentClick);
    window.addEventListener('hashchange', () => {
      const page = location.hash.slice(1);
      state.page = PAGES[page] ? page : 'overview';
      closeSidebar();
      renderPage({ animate: true });
    });
    window.addEventListener('resize', () => {
      if (window.innerWidth > 920) closeSidebar();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSidebar();
    });
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) {
      mq.addEventListener('change', () => {
        if (state.themePref === 'system') applyTheme();
      });
    }
    if (state.settings.reduceMotion) document.documentElement.classList.add('reduce-motion');
  }

  function closeSidebar() {
    $('#app').classList.remove('sidebar-open');
    $('#sidebar-scrim').hidden = true;
  }

  function onDocumentClick(e) {
    const pageTrigger = e.target.closest('[data-page]');
    if (pageTrigger) {
      e.preventDefault();
      const page = pageTrigger.dataset.page;
      closeSidebar();
      if (state.page === page) {
        renderPage({ animate: false });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        location.hash = page;
      }
      return;
    }

    const filterBtn = e.target.closest('[data-filter]');
    if (filterBtn) {
      state.tunnelFilter = filterBtn.dataset.filter;
      $$('[data-filter]').forEach((b) => b.classList.toggle('is-active', b === filterBtn));
      renderTunnelList();
      return;
    }

    const levelBtn = e.target.closest('[data-level]');
    if (levelBtn) {
      state.logLevel = levelBtn.dataset.level;
      $$('[data-level]').forEach((b) => b.classList.toggle('is-active', b === levelBtn));
      renderLogRows();
      return;
    }

    const actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
      e.preventDefault();
      handleAction(actionBtn);
    }
  }

  async function handleAction(btn) {
    const action = btn.dataset.action;
    const id = btn.dataset.id;

    switch (action) {
      case 'account':
        toast('账户切换是原型占位', 'success');
        break;
      case 'refresh':
        toast('状态已刷新 · 刚刚', 'success');
        updateUptime();
        break;
      case 'open-route-drawer':
      case 'add-route':
        openRouteDrawer('add');
        break;
      case 'disconnect':
        await doDisconnect();
        break;
      case 'reconnect':
        if (state.activeId) doConnect(state.activeId);
        break;
      case 'new-tunnel':
        openNewTunnel();
        break;
      case 'connect-tunnel':
        await connectTunnel(id);
        break;
      case 'disconnect-tunnel':
        await disconnectTunnel(id);
        break;
      case 'delete-tunnel':
        await deleteTunnel(id);
        break;
      case 'go-routes':
        if (id === state.activeId) {
          location.hash = 'routes';
        } else {
          toast('请先连接该隧道，再编辑路由', 'error');
        }
        break;
      case 'edit-route':
        openRouteDrawer('edit', id);
        break;
      case 'delete-route':
        await deleteRoute(id);
        break;
      case 'copy-yaml':
        copyText(rawYaml(), 'config.yml 已复制');
        break;
      case 'copy-endpoint':
        copyText(btn.dataset.copy || '', '地址已复制');
        break;
      case 'toggle-log-pause':
        toggleLogPause();
        break;
      case 'clear-logs':
        clearLogs();
        break;
      case 'download-logs':
        downloadLogs();
        break;
      case 'new-credential':
        openCredentialModal();
        break;
      case 'verify-account':
        verifyAccount(btn);
        break;
      case 'token-help':
        openTokenHelp();
        break;
      case 'reset-config':
        await resetConfig();
        break;
      case 'save-settings':
        saveSettings();
        break;
      case 'toggle-token':
        toggleTokenVisibility(btn);
        break;
      default:
        break;
    }
  }

  /* ---------- theme ---------- */
  function resolveTheme() {
    if (state.themePref === 'system') {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return state.themePref;
  }

  function applyTheme() {
    state.theme = resolveTheme();
    document.documentElement.dataset.theme = state.theme;
    const toggle = $('#theme-toggle');
    if (toggle) toggle.innerHTML = icon(state.theme === 'dark' ? 'sun' : 'moon');
  }

  /* ---------- render ---------- */
  function renderPage({ animate = true } = {}) {
    const page = PAGES[state.page] ? state.page : 'overview';
    state.page = page;
    $('#crumb').textContent = PAGES[page].title;
    document.title = `${PAGES[page].title} · Tunnel for fnOS`;
    $$('.nav-link').forEach((link) => {
      const isActive = link.dataset.page === page;
      link.classList.toggle('is-active', isActive);
      if (isActive) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });

    const pageEl = $('#page');
    const templates = {
      overview: tplOverview,
      tunnels: tplTunnels,
      routes: tplRoutes,
      logs: tplLogs,
      api: tplApi,
      settings: tplSettings
    };
    pageEl.innerHTML = templates[page]();
    hydrateIcons(pageEl);
    if (animate) {
      pageEl.classList.remove('is-entering');
      void pageEl.offsetWidth;
      pageEl.classList.add('is-entering');
    } else {
      pageEl.classList.remove('is-entering');
    }
    bindPage(page);
    updateNavCounts();
    updateSaveUI();
    updateUptime();
    if (page === 'tunnels') renderTunnelList();
    if (page === 'routes') {
      renderRouteRows();
      renderYaml();
    }
    if (page === 'logs') {
      renderLogRows();
      updateLogToolbar();
      scrollLogsToBottom();
    }

  function bindPage(page) {
    if (page === 'tunnels') {
      const search = $('#tunnel-search');
      if (search) {
        search.addEventListener('input', () => {
          state.tunnelQuery = search.value;
          renderTunnelList();
        });
      }
    }
    if (page === 'routes') {
      bindRouteDrag();
    }
    if (page === 'logs') {
      const search = $('#log-search');
      if (search) {
        search.addEventListener('input', () => {
          state.logQuery = search.value;
          renderLogRows();
        });
      }
      const auto = $('#auto-scroll');
      if (auto) {
        auto.checked = state.autoScroll;
        auto.addEventListener('change', () => {
          state.autoScroll = auto.checked;
          if (state.autoScroll) scrollLogsToBottom();
        });
      }
      const body = $('#log-body');
      if (body) {
        body.addEventListener('scroll', () => {
          if (Date.now() - lastAutoScrollAt < 250) return;
          const distance = body.scrollHeight - body.scrollTop - body.clientHeight;
          if (distance > 28 && state.autoScroll) {
            state.autoScroll = false;
            const auto = $('#auto-scroll');
            if (auto) auto.checked = false;
          }
        });
      }
      const rows = $('#log-rows');
      if (rows) {
        rows.addEventListener('click', (e) => {
          const line = e.target.closest('.log-line');
          if (!line) return;
          const entry = line.closest('.log-entry');
          const detail = entry.querySelector('.log-detail');
          const open = line.getAttribute('aria-expanded') === 'true';
          line.setAttribute('aria-expanded', String(!open));
          detail.hidden = open;
          if (!open) {
            state.autoScroll = false;
            const auto = $('#auto-scroll');
            if (auto) auto.checked = false;
          }
        });
      }
    }
    if (page === 'settings') bindSettings();
  }

  function updateNavCounts() {
    const tunnelCount = $('[data-page="tunnels"] .nav-count');
    if (tunnelCount) tunnelCount.textContent = String(state.tunnels.length);
    const routeCount = $('[data-page="routes"] .nav-count');
    if (routeCount) routeCount.textContent = String(activeTunnel() ? routesFor(state.activeId).length : 0);
  }

  function updateUptime() {
    const t = activeTunnel();
    const nodes = $$('[data-uptime]');
    if (!nodes.length) return;
    if (!t || t.status !== 'healthy' || !state.connectedAt) return;
    const html = formatUptimeHtml(Date.now() - state.connectedAt);
    nodes.forEach((node) => { node.innerHTML = html; });
  }

  function pushActivity(title, tone = 'blue', iconName = 'branch') {
    state.activitySeq += 1;
    state.activity.unshift({ id: `a${state.activitySeq}`, icon: iconName, tone, title, time: '刚刚' });
    state.activity = state.activity.slice(0, 6);
  }

  function safeRefresh() {
    updateNavCounts();
    if (['overview', 'tunnels', 'routes', 'api'].includes(state.page)) {
      renderPage({ animate: false });
    }
  }

  /* ---------- overview ---------- */
  function tplOverview() {
    const t = activeTunnel();
    const routes = t ? routesFor(t.id) : [];
    const status = t ? t.status : 'inactive';
    const meta = statusMeta(status);
    const isHealthy = status === 'healthy';
    const isConnecting = status === 'connecting';
    const isError = status === 'error';

    const heroPill = isHealthy
      ? `<span class="pill healthy"><span class="dot"></span>已连接</span>`
      : isConnecting
        ? `<span class="pill warning"><span class="spinner" style="width:9px;height:9px;border-width:1.5px"></span>连接中</span>`
        : isError
          ? `<span class="pill danger"><span class="dot"></span>连接异常</span>`
          : `<span class="pill neutral"><span class="dot"></span>未连接</span>`;

    const heroDesc = !t
      ? '还没有连接任何隧道。选择一条隧道开始，把 NAS 上的服务带到公网。'
      : isHealthy
        ? 'Cloudflare Edge 已建立 4 条连接，流量正在经过香港节点。'
        : isConnecting
          ? '正在与 Cloudflare Edge 建立连接，通常需要 1–3 秒。'
          : isError
            ? `上次错误：${escapeHtml(t.lastError || '连接中断')}。检查日志或重新连接。`
            : '当前隧道未连接。连接后，所有路由规则才会开始转发。';

    const heroActions = !t
      ? `<button class="btn primary" data-page="tunnels">${icon('waypoints')}选择隧道</button>`
      : isHealthy
        ? `<button class="btn ghost danger-text" data-action="disconnect">断开连接</button>`
        : isConnecting
          ? `<button class="btn primary" disabled><span class="spinner"></span>连接中</button>`
          : isError
            ? `<button class="btn primary" data-action="reconnect">${icon('refresh')}重新连接</button>`
            : `<button class="btn primary" data-action="reconnect">${icon('plug')}连接隧道</button>`;

    const uptime = isHealthy
      ? `<span class="uptime" data-uptime>${formatUptimeHtml(Date.now() - state.connectedAt)}</span>`
      : `<span class="uptime is-idle">—</span>`;

    const routeRows = routes.slice(0, 3).map((r) => {
      const dns = dnsMeta(r.dns);
      return `
        <tr>
          <td><span class="host">${escapeHtml(r.host)}</span></td>
          <td><span class="service">${escapeHtml(r.service)}</span></td>
          <td><span class="pill ${dns.pill}">${dns.label}</span></td>
          <td class="cell-actions"><button class="icon-btn" type="button" data-action="edit-route" data-id="${r.id}" aria-label="编辑路由">${icon('arrow-up-right')}</button></td>
        </tr>`;
    }).join('');

    const routeTable = routes.length
      ? `<div class="table-wrap"><table class="data-table">
          <thead><tr><th>域名</th><th>内网服务</th><th>DNS</th><th></th></tr></thead>

  function metricCard(label, value, foot, iconName, values, sparkId, green = false) {
    return `
      <section class="card metric reveal">
        <div class="metric-label">${icon(iconName)}${label}</div>
        <div class="metric-value">${value}</div>
        <div class="metric-foot">${foot}</div>
        ${sparkline(values, sparkId, green)}
      </section>`;
  }

  function sparkline(values, id, green) {
    const w = 84;
    const h = 28;
    const min = Math.min(...values);
    const max = Math.max(...values);
    const span = max - min || 1;
    const pts = values.map((v, i) => {
      const x = (i / (values.length - 1)) * w;
      const y = h - 4 - ((v - min) / span) * (h - 8);
      return [x, y];
    });
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
    const area = `${line} L ${w} ${h} L 0 ${h} Z`;
    return `<svg class="metric-spark ${green ? 'green' : ''}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="${green ? 'var(--teal)' : 'var(--accent)'}" stop-opacity=".25"/>
        <stop offset="1" stop-color="${green ? 'var(--teal)' : 'var(--accent)'}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${area}" fill="url(#${id})"/>
      <path d="${line}" class="line"/>
    </svg>`;
  }

  /* ---------- tunnels ---------- */
  function tplTunnels() {
    return `
      <section class="page-head reveal" style="--i:0">

          <p class="eyebrow">网络</p>
          <h1>隧道</h1>

        </div>

      </section>`;
  }

  function renderTunnelList() {
    const root = $('#tunnel-list');
    if (!root) return;
    const q = state.tunnelQuery.trim().toLowerCase();
    const filtered = state.tunnels.filter((t) => {
      if (state.tunnelFilter === 'connected' && !['healthy', 'connecting'].includes(t.status)) return false;
      if (state.tunnelFilter === 'idle' && t.status !== 'inactive') return false;
      if (state.tunnelFilter === 'error' && t.status !== 'error') return false;
      if (!q) return true;
      return t.name.toLowerCase().includes(q) || t.id.toLowerCase().includes(q);
    });

    if (!filtered.length) {
      root.innerHTML = `
        <div class="table-empty">
          <div style="font-weight:700;color:var(--ink-2);margin-bottom:4px">没有匹配的隧道</div>
          换一个筛选条件，或创建一条新隧道。
        </div>`;
      return;
    }

    root.innerHTML = filtered.map((t) => {
      const meta = statusMeta(t.status);
      const isActive = t.id === state.activeId;
      const routes = routesFor(t.id).length;
      const actions = t.status === 'healthy'
        ? `<button class="btn small ghost" type="button" data-action="disconnect-tunnel" data-id="${t.id}">断开</button>`
        : t.status === 'connecting'
          ? `<button class="btn small ghost" type="button" disabled><span class="spinner"></span>连接中</button>`
          : `<button class="btn small primary" type="button" data-action="connect-tunnel" data-id="${t.id}">连接</button>`;
      return `
        <div class="tunnel-row ${isActive ? 'is-active' : ''}" data-id="${t.id}">
          <div class="tunnel-ident">
            <span class="status-dot ${meta.dot}" aria-hidden="true"></span>
            <div class="t-copy">
              <strong>${escapeHtml(t.name)}</strong>
              <span class="mono">${shortId(t.id)}</span>
            </div>
          </div>
          <div class="tunnel-meta"><strong>${routes}</strong>条路由</div>
          <div class="tunnel-meta"><strong>${t.created}</strong>创建</div>
          <div class="tunnel-status">
            <span class="pill ${meta.pill}">${meta.label}</span>
            <span class="micro">${t.status === 'healthy' ? '已连接 · 当前' : t.status === 'error' ? escapeHtml(t.lastError || '连接中断') : meta.micro}</span>
          </div>
          <div class="row-actions">
            ${actions}
            <button class="btn small ghost" type="button" data-action="go-routes" data-id="${t.id}">路由</button>
            <button class="icon-btn" type="button" data-action="delete-tunnel" data-id="${t.id}" aria-label="删除隧道">${icon('trash')}</button>
          </div>
        </div>`;
    }).join('');
  }

  async function connectTunnel(id) {
    const target = state.tunnels.find((t) => t.id === id);
    if (!target || state.connectingId) return;
    const current = activeTunnel();
    if (current && current.id !== id && current.status === 'healthy') {
      const result = await dialog({
        title: '切换隧道？',
        message: `当前隧道 ${current.name} 将立即断开，${target.name} 会接管连接。`,
        confirmText: '切换连接'
      });
      if (!result.ok) return;
    }
    doConnect(id);
  }

  function doConnect(id) {
    const target = state.tunnels.find((t) => t.id === id);
    if (!target || state.connectingId) return;
    const current = activeTunnel();
    if (current && current.id !== id) current.status = 'inactive';
    state.connectingId = id;
    state.activeId = id;
    target.status = 'connecting';
    safeRefresh();
    setTimeout(() => {
      target.status = 'healthy';
      target.lastError = '';
      state.connectingId = null;
      state.connectedAt = Date.now();
      pushActivity(`隧道 ${target.name} 已连接`, 'green', 'link');
      toast(`隧道 ${target.name} 已连接`, 'success');
      safeRefresh();
    }, 950);
  }

  async function doDisconnect() {
    const t = activeTunnel();
    if (!t || t.status === 'inactive') return;
    const result = await dialog({
      title: '断开隧道？',
      message: '断开后，所有域名转发规则将暂时失效；隧道本身和路由配置会保留。',
      confirmText: '断开连接',
      tone: 'danger'
    });
    if (!result.ok) return;
    t.status = 'inactive';
    state.activeId = null;
    state.connectedAt = null;
    pushActivity(`隧道 ${t.name} 已断开`, 'danger', 'plug');
    toast('已断开连接', 'success');
    safeRefresh();
  }

  async function disconnectTunnel(id) {
    if (id !== state.activeId) return;
    await doDisconnect();
  }

  async function deleteTunnel(id) {
    const t = state.tunnels.find((item) => item.id === id);
    if (!t) return;
    const isActive = state.activeId === id;
    const result = await dialog({
      title: '删除隧道？',
      message: isActive
        ? `隧道 ${t.name} 正在使用中。删除会先断开连接，并移除本地路由记录；Cloudflare 上的隧道与 DNS 记录不会自动删除。`
        : `删除 ${t.name} 的本地记录。Cloudflare 上的隧道与 DNS 记录不会自动删除。`,
      confirmText: '删除隧道',
      tone: 'danger'
    });
    if (!result.ok) return;
    if (isActive) {
      state.activeId = null;
      state.connectedAt = null;
    }
    state.tunnels = state.tunnels.filter((item) => item.id !== id);
    delete state.routesByTunnel[id];
    pushActivity(`隧道 ${t.name} 已删除`, 'danger', 'trash');
    toast('隧道已从本地移除', 'success');
    safeRefresh();
  }

  function openNewTunnel() {
    const html = `
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="new-tunnel-title">
        <div class="modal-head">
          <div><p class="eyebrow">新建</p><h2 id="new-tunnel-title">创建隧道</h2></div>
          <button class="icon-btn" type="button" data-close aria-label="关闭">${icon('x')}</button>
        </div>
        <form id="new-tunnel-form" class="modal-body">
          <div class="form-grid">
            <div class="field" data-field="name">
              <label for="tunnel-name">隧道名称</label>
              <input class="input mono" id="tunnel-name" name="name" placeholder="fnos-home" autocomplete="off" spellcheck="false">
              <span class="hint">只用于识别，不影响域名。支持小写字母、数字和短横线。</span>
              <span class="error">请输入 2–32 位小写名称，例如 fnos-home</span>
            </div>
            <label class="check-row">
              <span class="switch"><input id="tunnel-auto-connect" type="checkbox" checked><i></i></span>
              <span class="check-copy"><strong>创建后立即连接</strong><small>创建成功后会接管当前连接；已有隧道会先断开。</small></span>
            </label>
            <div class="modal-warning">${icon('info')} 原型不会真的请求 Cloudflare；正式实现会调用 Cloudflare API 创建隧道。</div>
          </div>
        </form>
        <div class="modal-foot">
          <button class="btn ghost" type="button" data-close>取消</button>
          <button class="btn primary" type="submit" form="new-tunnel-form">创建隧道</button>
        </div>
      </div>`;
    const { layer, close } = openLayer({ html });
    const form = layer.querySelector('#new-tunnel-form');
    const input = layer.querySelector('#tunnel-name');
    input.addEventListener('input', () => {
      input.value = input.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
      input.closest('.field').classList.remove('has-error');
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = input.value.trim();
      if (!/^[a-z0-9][a-z0-9-]{1,31}$/.test(name)) {
        input.closest('.field').classList.add('has-error');
        input.focus();
        return;
      }
      if (state.tunnels.some((t) => t.name === name)) {
        input.closest('.field').classList.add('has-error');
        input.focus();
        return;
      }
      const id = uid();
      state.tunnels.push({ id, name, status: 'inactive', created: today(), lastError: '' });
      state.routesByTunnel[id] = [];
      pushActivity(`隧道 ${name} 已创建`, 'blue', 'plus');
      toast(`隧道 ${name} 已创建`, 'success');
      close();
      safeRefresh();
      if (layer.querySelector('#tunnel-auto-connect')?.checked) {
        setTimeout(() => doConnect(id), 140);
      }
    });
    setTimeout(() => input.focus(), 80);
  }

  function bindRouteDrag() {
    let dragId = null;
    $$('.route-row[draggable="true"]').forEach((row) => {
      row.addEventListener('dragstart', (e) => {
        dragId = row.dataset.id;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', dragId);
        row.classList.add('is-dragging');
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('is-dragging');
        $$('.route-row').forEach((r) => r.classList.remove('is-drag-over'));
      });
      row.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (row.dataset.id !== dragId) row.classList.add('is-drag-over');
      });
      row.addEventListener('dragleave', () => row.classList.remove('is-drag-over'));
      row.addEventListener('drop', (e) => {
        e.preventDefault();
        row.classList.remove('is-drag-over');
        if (!dragId || dragId === row.dataset.id) return;
        const t = activeTunnel();
        if (!t) return;
        const list = routesFor(t.id);
        const from = list.findIndex((r) => r.id === dragId);
        const to = list.findIndex((r) => r.id === row.dataset.id);
        if (from < 0 || to < 0) return;
        const [moved] = list.splice(from, 1);
        list.splice(to, 0, moved);
        pushActivity('路由顺序已更新', 'blue', 'list');
        toast('路由顺序已更新', 'success');
        renderRouteRows();
        renderYaml();
      });
    });
  }

  function rawYaml() {
    const t = activeTunnel();
    if (!t) return '';
    const routes = routesFor(t.id);
    const lines = [
      '# 由 Tunnel 路由表生成',
      `tunnel: ${t.id}`,
      'credentials-file: /var/apps/cloudflare-tunnel/var/credentials.json',
      'ingress:'
    ];
    routes.forEach((r) => {
      lines.push(`  - hostname: ${r.host}`);
      if (r.path) lines.push(`    path: ${r.path}`);
      lines.push(`    service: ${r.service}`);
      if (r.noTLSVerify || r.hostHeader) {
        lines.push('    originRequest:');
        if (r.noTLSVerify) lines.push('      noTLSVerify: true');
        if (r.hostHeader) lines.push(`      httpHostHeader: ${r.hostHeader}`);
      }
    });
    lines.push('  - service: http_status:404');
    return lines.join('\n');
  }

    const pathInput = layer.querySelector('#route-path');
    const hostHeaderInput = layer.querySelector('#route-host-header');
    const autoDns = layer.querySelector('#route-auto-dns');
    const noTls = layer.querySelector('#route-no-tls');
    const clearError = (input) => input.closest('.field')?.classList.remove('has-error');
    [hostInput, serviceInput, pathInput].forEach((input) => input.addEventListener('input', () => clearError(input)));

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const host = hostInput.value.trim().toLowerCase();
      const service = serviceInput.value.trim();
      const path = pathInput.value.trim();
      const hostHeader = hostHeaderInput.value.trim();
      let invalid = false;
      if (!/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+$/.test(host)) {

        hostInput.closest('.field').classList.add('has-error');
        invalid = true;
      }
      if (!/^(?:https?|tcp|ssh|rdp|smb):\/\/|^unix:/.test(service)) {
        serviceInput.closest('.field').classList.add('has-error');
        invalid = true;
      }
      if (path && !path.startsWith('/')) {
        pathInput.closest('.field').classList.add('has-error');
        invalid = true;
      }
      if (invalid) {
        (layer.querySelector('.field.has-error .input') || hostInput).focus();
        return;
      }

      const list = state.routesByTunnel[t.id];
      const saved = {
        id: route.id || `r-${uid()}`,
        host,
        service,
        dns: autoDns.checked ? 'created' : (route.dns === 'created' ? 'created' : 'pending'),
        noTLSVerify: noTls.checked,
        path,
        hostHeader
      };
      if (mode === 'edit') {
        const index = list.findIndex((r) => r.id === route.id);
        if (index >= 0) list[index] = saved;
      } else {
        list.push(saved);
      }
      pushActivity(`路由 ${host} 已${mode === 'edit' ? '更新' : '添加'}`, 'blue', 'branch');
      toast(autoDns.checked ? '路由已保存 · CNAME 已创建' : '路由已保存 · 等待手动创建 DNS', 'success');
      close();
      safeRefresh();
    });
    setTimeout(() => hostInput.focus(), 120);
  }

    const result = await dialog({
      title: '删除路由？',

    toast(result.checked ? '路由与 DNS 记录已删除' : '路由已删除，DNS 记录保留', 'success');
