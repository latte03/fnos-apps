name: Sync app sources

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      disklens_tag:
        description: 'DiskLens 上游 tag（留空表示最新 Release）'
        required: false
        type: string
      quark_tag:
        description: 'fnOS-quark 上游 tag（留空表示最新 Release）'
        required: false
        type: string
      fnmedia_tag:
        description: 'fnmedia-ext 上游 tag（留空表示最新 Release）'
        required: false
        type: string
      douyin_tag:
        description: 'DouyinDL 上游 tag（留空表示最新 Release）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-app-sources
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sync DiskLens metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.disklens_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            node scripts/sync-disklens.mjs --tag "$INPUT_TAG"
          else
            node scripts/sync-disklens.mjs
          fi

      - name: Sync fnOS-quark metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.quark_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            node scripts/sync-fnos-quark.mjs --tag "$INPUT_TAG"
          else
            node scripts/sync-fnos-quark.mjs
          fi

      - name: Sync fnmedia-ext metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.fnmedia_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            node scripts/sync-fnmedia-ext.mjs --tag "$INPUT_TAG"
          else
            node scripts/sync-fnmedia-ext.mjs
          fi

      - name: Sync DouyinDL metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.douyin_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            node scripts/sync-douyin-dl.mjs --tag "$INPUT_TAG"
          else
            node scripts/sync-douyin-dl.mjs
          fi

      - name: Validate source and downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate.mjs --remote

      - name: Commit changes
        run: |
          if git diff --quiet -- fnpack.json; then
            echo "fnpack.json 无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fnpack.json
          git commit -m "chore: sync app release metadata"
          git push
